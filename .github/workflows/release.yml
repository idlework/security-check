name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../security-check-${{ matrix.target }}.tar.gz security-check
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-check-${{ matrix.target }}
          path: security-check-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            security-check-aarch64-apple-darwin/security-check-aarch64-apple-darwin.tar.gz
            security-check-x86_64-apple-darwin/security-check-x86_64-apple-darwin.tar.gz
